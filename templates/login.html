```html
{% extends "base.html" %}

{% block content %}

<div class="login-container">

    <h2>Welcome Back!</h2>
    <p>Login to your Smart Farming System</p>

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <p class="register-link">
        Don't have an account?
        <a href="{{ url_for('register') }}">Register here</a>
    </p>

</div>

<style>
.login-container {
    max-width: 420px;
    margin: 50px auto;
    padding: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.login-container h2,
.login-container > p {
    text-align: center;
}

.login-container label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

.login-container input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.login-container button {
    width: 100%;
    padding: 12px;
    margin-top: 25px;
    background: #287a3d;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.login-container button:hover {
    background: #1d5e2e;
}

.error-message {
    color: #b00020;
    text-align: center;
    margin: 15px 0;
}

.register-link {
    margin-top: 20px;
}

.register-link a {
    color: #287a3d;
    text-decoration: none;
    font-weight: bold;
}
</style>

{% endblock %}
```
