{% extends "base.html" %}

{% block content %}

<div class="registration-container">
    <h2>Create Your Account</h2>
    <p>Join Smart Farming System</p>

```
{% if error %}
    <div class="error-message">{{ error }}</div>
{% endif %}

{% if success %}
    <div class="success-message">{{ success }}</div>
{% endif %}

<form action="{{ url_for('register') }}" method="POST">

    <label for="name">Full Name</label>
    <input
        type="text"
        id="name"
        name="name"
        maxlength="100"
        autocomplete="name"
        required
    >

    <label for="email">Email Address</label>
    <input
        type="email"
        id="email"
        name="email"
        maxlength="254"
        autocomplete="email"
        required
    >

    <label for="phone">Phone Number</label>
    <input
        type="tel"
        id="phone"
        name="phone"
        maxlength="20"
        autocomplete="tel"
        required
    >

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        name="password"
        minlength="8"
        autocomplete="new-password"
        required
    >

    <label for="confirm_password">Confirm Password</label>
    <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        minlength="8"
        autocomplete="new-password"
        required
    >

    <button type="submit">Register</button>

</form>

<p class="login-link">
    Already have an account?
    <a href="{{ url_for('login') }}">Login here</a>
</p>
```

</div>

<style>
.registration-container {
    max-width: 450px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 12px;
    background: white;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.registration-container h2,
.registration-container p {
    text-align: center;
}

.registration-container label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

.registration-container input {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.registration-container button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #287a3d;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.registration-container button:hover {
    background: #1d5e2e;
}

.error-message {
    color: #b00020;
    margin: 12px 0;
    text-align: center;
}

.success-message {
    color: #176b2c;
    margin: 12px 0;
    text-align: center;
}

.login-link {
    margin-top: 20px;
}
</style>

{% endblock %}
